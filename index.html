<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bevásárlólista</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>🛒 Bevásárlólista</h1>
    <p class="intro">Írd össze, mit szeretnél vásárolni!</p>
    <form id="add-form">
      <label for="product-input">Új termék</label>
      <div class="input-row">
        <input id="product-input" type="text" placeholder="Pl. tej" maxlength="80" required autocomplete="off">
        <button type="submit">Hozzáadás</button>
      </div>
    </form>
    <label for="search-input">Keresés a listában</label>
    <input id="search-input" type="search" placeholder="Termék keresése...">
    <div class="list-header"><h2>Termékek</h2><span id="count">0 termék</span></div>
    <ul id="product-list" aria-live="polite"></ul>
    <p id="empty-message">A lista még üres.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
